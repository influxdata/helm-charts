suite: Core explicit memory sizes
release:
  name: t
  namespace: default
tests:
  - it: rejects memory.execMemPoolSize '1Gi'
    set:
      memory.execMemPoolSize: 1Gi
    asserts:
      - failedTemplate:
          errorMessage: memory.execMemPoolSize must carry a unit suffix the server accepts (b, kb, mb, gb, tb - all 1024-based) or be a percentage, got "1Gi". Bare numbers and Kubernetes suffixes such as Gi are rejected by InfluxDB and the pod will not start.
  - it: rejects memory.execMemPoolSize 4096
    set:
      memory.execMemPoolSize: 4096
    asserts:
      - failedTemplate:
          errorMessage: memory.execMemPoolSize must carry a unit suffix the server accepts (b, kb, mb, gb, tb - all 1024-based) or be a percentage, got "4096". Bare numbers and Kubernetes suffixes such as Gi are rejected by InfluxDB and the pod will not start.
  - it: rejects memory.execMemPoolSize False
    set:
      memory.execMemPoolSize: false
    asserts:
      - failedTemplate:
          errorMessage: memory.execMemPoolSize must carry a unit suffix the server accepts (b, kb, mb, gb, tb - all 1024-based) or be a percentage, got "false". Bare numbers and Kubernetes suffixes such as Gi are rejected by InfluxDB and the pod will not start.
  - it: rejects memory.execMemPoolSize ''
    set:
      memory.execMemPoolSize: ''
    asserts:
      - failedTemplate:
          errorMessage: memory.execMemPoolSize is set to an empty value. Remove the key to use the server default, or give it a unit suffix the server accepts (b, kb, mb, gb, tb - all 1024-based).
  - it: rejects memory.execMemPoolSize '101%'
    set:
      memory.execMemPoolSize: 101%
    asserts:
      - failedTemplate:
          errorMessage: memory.execMemPoolSize must be between 0 and 100 percent, got "101%".
  - it: rejects memory.execMemPoolSize '1.5%'
    set:
      memory.execMemPoolSize: 1.5%
    asserts:
      - failedTemplate:
          errorMessage: memory.execMemPoolSize must be a whole percentage such as "20%", got "1.5%".
  - it: accepts memory.execMemPoolSize 1gb
    template: templates/configmap.yaml
    set:
      memory.execMemPoolSize: 1gb
    asserts:
      - hasDocuments:
          count: 1
  - it: accepts memory.execMemPoolSize 20%
    template: templates/configmap.yaml
    set:
      memory.execMemPoolSize: 20%
    asserts:
      - hasDocuments:
          count: 1
  - it: accepts memory.execMemPoolSize 0%
    template: templates/configmap.yaml
    set:
      memory.execMemPoolSize: 0%
    asserts:
      - hasDocuments:
          count: 1
  - it: accepts memory.execMemPoolSize +020%
    template: templates/configmap.yaml
    set:
      memory.execMemPoolSize: +020%
    asserts:
      - hasDocuments:
          count: 1
