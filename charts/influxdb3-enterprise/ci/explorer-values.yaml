license:
  type: commercial
  existingSecret: influxdb3-license

objectStorage:
  type: file
  file:
    persistence:
      accessMode: ReadWriteOnce
      size: 5Gi

ingress:
  enabled: true
  host: influxdb.ci.example.com

networkPolicy:
  enabled: true

ingester:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

querier:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

compactor:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

webui:
  enabled: true
  sessionSecret: "ci-webui-session-secret"
explorer:
  enabled: true
  sessionSecret: "ci-explorer-session-secret"
  mode: admin
  persistence:
    enabled: true
    size: 1Gi
  ingress:
    enabled: true
    host: explorer.ci.example.com
  defaultConnection:
    enabled: true
    database: "explorer_demo"
    apiToken: "apiv3_ci_admin_token"
    serverName: "Helm Standalone Explorer"
