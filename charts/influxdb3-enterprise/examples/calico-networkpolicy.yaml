# Calico policy example for this chart, rendered through extraObjects.
# Optional processor, Web UI, distributed-compaction and Prometheus rules
# are commented out. Uncomment the required ingress and egress blocks.
# Adapt labels, ports and allowed sources/destinations to your deployment.
# Raw manifest: load with --set-file, not -f.
# Run from the chart directory with your deployment values:
# helm upgrade --install influxdb3-enterprise . --namespace influxdb3 -f my-values.yaml --set-file 'extraObjects[0]=examples/calico-networkpolicy.yaml'
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: "{{ .Release.Name }}-network-policy"
  namespace: "{{ .Release.Namespace }}"
spec:
  # Optional components are selected too; enable their rules below when used.
  selector: >-
    app.kubernetes.io/name == '{{ include "influxdb3-enterprise.name" . }}' &&
    app.kubernetes.io/instance == '{{ .Release.Name }}' &&
    app.kubernetes.io/component in {'ingester', 'querier', 'compactor', 'processor', 'webui'}
  types: [Ingress, Egress]
  ingress:
    # Ingress controller -> ingesters and queriers.
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: "kubernetes.io/metadata.name == 'ingress-nginx'"
        selector: "app.kubernetes.io/name == 'ingress-nginx'"
      destination:
        selector: "app.kubernetes.io/component in {'ingester', 'querier'}"
        ports: [8181]
    # Ingester HTTP sources.
    - action: Allow
      protocol: TCP
      source:
        selector: >-
          app.kubernetes.io/name == '{{ include "influxdb3-enterprise.name" . }}' &&
          app.kubernetes.io/instance == '{{ .Release.Name }}' &&
          app.kubernetes.io/component in {'compactor', 'ingester'}
      destination:
        selector: "app.kubernetes.io/component == 'ingester'"
        ports: [8181]
    # Querier and compactor HTTP sources.
    - action: Allow
      protocol: TCP
      source:
        selector: >-
          app.kubernetes.io/name == '{{ include "influxdb3-enterprise.name" . }}' &&
          app.kubernetes.io/instance == '{{ .Release.Name }}' &&
          app.kubernetes.io/component == 'querier'
      destination:
        selector: "app.kubernetes.io/component in {'querier', 'compactor'}"
        ports: [8181]
