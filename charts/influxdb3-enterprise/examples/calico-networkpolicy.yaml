  egress:
    # DNS.
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
        selector: "k8s-app == 'kube-dns'"
        ports: [53]
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
        selector: "k8s-app == 'kube-dns'"
        ports: [53]
    # Default object-store access; adapt ports and destinations.
    - action: Allow
      protocol: TCP
      destination:
        ports: [443, 80, 9000]
    # Ingester HTTP destinations.
    - action: Allow
      protocol: TCP
      source:
        selector: "app.kubernetes.io/component == 'ingester'"
      destination:
        selector: >-
          app.kubernetes.io/name == '{{ include "influxdb3-enterprise.name" . }}' &&
          app.kubernetes.io/instance == '{{ .Release.Name }}' &&
          app.kubernetes.io/component in {'ingester', 'querier'}
        ports: [8181]
    # Querier HTTP destinations.
    - action: Allow
      protocol: TCP
      source:
        selector: "app.kubernetes.io/component == 'querier'"
      destination:
        selector: >-
          app.kubernetes.io/name == '{{ include "influxdb3-enterprise.name" . }}' &&
          app.kubernetes.io/instance == '{{ .Release.Name }}'
        ports: [8181]
    # Compactor HTTP destinations.
    - action: Allow
      protocol: TCP
      source:
        selector: "app.kubernetes.io/component == 'compactor'"
      destination:
        selector: >-
          app.kubernetes.io/name == '{{ include "influxdb3-enterprise.name" . }}' &&
          app.kubernetes.io/instance == '{{ .Release.Name }}' &&
          app.kubernetes.io/component == 'querier'
        ports: [8181]
