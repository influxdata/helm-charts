{{- if .Values.compactor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "influxdb3-enterprise.fullname" . }}-compactor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: compactor
  {{- with .Values.compactor.service.annotations }}
  annotations:
    {{- include "influxdb3-enterprise.annotations" . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.compactor.service.type }}
  ports:
    - port: {{ .Values.compactor.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "influxdb3-enterprise.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: compactor
{{- if has (get .Values.compactor "dispatchTarget") (list "all" "remote") }}
{{- range $ordinal := until (int .Values.compactor.replicas) }}
{{- $podName := include "influxdb3-enterprise.compactorPodName" (dict "root" $ "ordinal" $ordinal) }}
---
apiVersion: v1
kind: Service
metadata:
  # Must exactly match the StatefulSet Pod name advertised by --conn-info.
  name: {{ $podName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" $ | nindent 4 }}
    app.kubernetes.io/component: compactor
spec:
  type: ClusterIP
  ports:
    - port: {{ include "influxdb3-enterprise.compactorInternodePort" $ }}
      targetPort: grpc-internode
      protocol: TCP
      name: grpc-internode
  selector:
    {{- include "influxdb3-enterprise.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: compactor
    statefulset.kubernetes.io/pod-name: {{ $podName }}
{{- end }}
{{- end }}
{{- end }}
