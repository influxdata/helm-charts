{{- $explorer := .Values.explorer | default dict -}}
{{- if get $explorer "enabled" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "influxdb3-enterprise.fullname" . }}-explorer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: explorer
spec:
  replicas: {{ .Values.explorer.replicas }}
  {{- if .Values.explorer.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "influxdb3-enterprise.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: explorer
  template:
    metadata:
      annotations:
        checksum/explorer-secret: {{ include (print $.Template.BasePath "/secret-explorer.yaml") . | sha256sum }}
        checksum/explorer-config: {{ include (print $.Template.BasePath "/secret-explorer-config.yaml") . | sha256sum }}
        {{- with .Values.explorer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "influxdb3-enterprise.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: explorer
        {{- with .Values.explorer.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "influxdb3-enterprise.serviceAccountName" . }}
      # The Explorer is a separate upstream image with no need for the Kubernetes
      # API, and it is the one workload this chart encourages exposing publicly.
      automountServiceAccountToken: false
      {{- with .Values.explorer.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.explorer.podSecurityContext | nindent 8 }}
      containers:
        - name: explorer
          securityContext:
            {{- toYaml .Values.explorer.securityContext | nindent 12 }}
          image: {{ include "influxdb3-enterprise.explorer.image" . }}
          imagePullPolicy: {{ .Values.explorer.image.pullPolicy }}
          args:
            - --mode={{ .Values.explorer.mode | default "query" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "influxdb3-enterprise.explorerSecretName" . }}
                  key: session-secret
            - name: DATABASE_URL
              value: {{ .Values.explorer.databaseUrl | quote }}
            {{- if .Values.explorer.defaultConnection.enabled }}
            # The image's own config directory, /app-root/config, has to stay
            # writable for its entrypoint, so the Secret is mounted elsewhere.
            - name: CONFIG_PATH
              value: /etc/influxdb3-explorer/config.json
            {{- end }}
            {{- include "influxdb3-enterprise.componentExtraEnv" (dict "root" . "component" .Values.explorer) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.explorer.resources | nindent 12 }}
          volumeMounts:
            - name: explorer-db
              mountPath: /db
            {{- if .Values.explorer.defaultConnection.enabled }}
            - name: explorer-config
              mountPath: /etc/influxdb3-explorer
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.explorer.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.explorer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.explorer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.explorer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: explorer-db
          {{- if .Values.explorer.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.explorer.persistence.existingClaim | default (printf "%s-explorer" (include "influxdb3-enterprise.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.explorer.defaultConnection.enabled }}
        - name: explorer-config
          secret:
            secretName: {{ include "influxdb3-enterprise.explorerConfigSecretName" . }}
            items:
              - key: config.json
                path: config.json
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.explorer.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
