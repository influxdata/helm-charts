{{- if .Values.ingester.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "influxdb3-enterprise.fullname" . }}-ingester
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingester
spec:
  serviceName: {{ include "influxdb3-enterprise.fullname" . }}-ingester
  replicas: {{ .Values.ingester.replicas }}
  {{- if .Values.ingester.updateStrategy }}
  updateStrategy:
    {{- toYaml .Values.ingester.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "influxdb3-enterprise.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingester
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-object-storage.yaml") . | sha256sum }}
        checksum/license: {{ include "influxdb3-enterprise.licenseChecksum" . }}
        checksum/webui: {{ include (print $.Template.BasePath "/secret-webui.yaml") . | sha256sum }}
        {{- with .Values.ingester.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "influxdb3-enterprise.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingester
        {{- with .Values.ingester.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "influxdb3-enterprise.serviceAccountName" . }}
      {{- if not (kindIs "invalid" .Values.serviceAccount.automountServiceAccountToken) }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- if .Values.ingester.priorityClassName }}
      priorityClassName: {{ .Values.ingester.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.ingester.podSecurityContext | nindent 8 }}
      containers:
        - name: influxdb3
          {{- with .Values.ingester.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "influxdb3-enterprise.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --mode={{ .Values.ingester.mode | default "ingest" }}
            - --node-id=$(POD_NAME)
            {{- if .Values.engine.upgradePachaTree }}
            - --upgrade-pacha-tree
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "influxdb3-enterprise.fullname" . }}-config
          env:
            {{- include "influxdb3-enterprise.podNameEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.licenseEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.webuiSessionSecretEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.objectStoreSecretEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.adminTokenEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.permissionTokensEnv" . | nindent 12 }}
            {{- with .Values.ingester.numIOThreads }}
            - name: INFLUXDB3_NUM_IO_THREADS
              value: {{ . | quote }}
            {{- end }}
            {{- if hasKey .Values.ingester "numCores" }}
            - name: INFLUXDB3_NUM_CORES
              value: {{ .Values.ingester.numCores | quote }}
            {{- end }}
            {{- with .Values.ingester.wal }}
            {{- if .flushInterval }}
            - name: INFLUXDB3_WAL_FLUSH_INTERVAL
              value: {{ .flushInterval | quote }}
            {{- end }}
            {{- if .snapshotSize }}
            - name: INFLUXDB3_WAL_FILES_PER_SNAPSHOT
              value: {{ .snapshotSize | quote }}
            {{- end }}
            {{- if .maxWriteBufferSize }}
            - name: INFLUXDB3_WAL_MAX_BUFFERED_WRITES
              value: {{ .maxWriteBufferSize | quote }}
            {{- end }}
            {{- if .snapshotFilesToKeep }}
            - name: INFLUXDB3_SNAPSHOTTED_WAL_FILES_TO_KEEP
              value: {{ .snapshotFilesToKeep | quote }}
            {{- end }}
            {{- if hasKey . "replayFailOnError" }}
            - name: INFLUXDB3_WAL_REPLAY_FAIL_ON_ERROR
              value: {{ ternary "true" "false" .replayFailOnError | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.ingester.memory }}
            {{- if .execMemPoolBytes }}
            - name: INFLUXDB3_EXEC_MEM_POOL_SIZE
              value: {{ .execMemPoolBytes | quote }}
            {{- end }}
            {{- $forceSnapshotMemSize := .forceSnapshotMemSize | default .forceSnapshotMemThreshold }}
            {{- if $forceSnapshotMemSize }}
            - name: INFLUXDB3_FORCE_SNAPSHOT_MEM_SIZE
              value: {{ $forceSnapshotMemSize | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.ingester.datafusion }}
            {{- if .numThreads }}
            - name: INFLUXDB3_NUM_DATAFUSION_THREADS
              value: {{ .numThreads | quote }}
            {{- end }}
            {{- if .maxParquetFanout }}
            - name: INFLUXDB3_DATAFUSION_MAX_PARQUET_FANOUT
              value: {{ .maxParquetFanout | quote }}
            {{- end }}
            {{- if .config }}
            - name: INFLUXDB3_DATAFUSION_CONFIG
              value: {{ .config | quote }}
            {{- end }}
            {{- end }}
            {{- include "influxdb3-enterprise.pachaTreeEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.nonProcessorUnsetVars" (dict "root" . "component" .Values.ingester) | nindent 12 }}
            {{- include "influxdb3-enterprise.componentExtraEnv" (dict "root" . "component" .Values.ingester) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8181
              protocol: TCP
          {{- include "influxdb3-enterprise.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.ingester.resources | nindent 12 }}
          volumeMounts:
            {{ include "influxdb3-enterprise.sharedVolumeMounts" . | nindent 12 }}
            {{ include "influxdb3-enterprise.adminTokenVolumeMounts" . | nindent 12 }}
            {{ include "influxdb3-enterprise.permissionTokensVolumeMounts" . | nindent 12 }}
      {{- with .Values.ingester.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingester.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingester.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{ include "influxdb3-enterprise.sharedVolumes" . | nindent 8 }}
        {{ include "influxdb3-enterprise.adminTokenVolumes" . | nindent 8 }}
        {{ include "influxdb3-enterprise.permissionTokensVolumes" . | nindent 8 }}
{{- end }}
