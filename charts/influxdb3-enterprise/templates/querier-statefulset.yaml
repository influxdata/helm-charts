{{- if .Values.querier.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "influxdb3-enterprise.fullname" . }}-querier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: querier
spec:
  serviceName: {{ include "influxdb3-enterprise.fullname" . }}-querier
  replicas: {{ .Values.querier.replicas }}
  {{- if .Values.querier.updateStrategy }}
  updateStrategy:
    {{- toYaml .Values.querier.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "influxdb3-enterprise.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: querier
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-object-storage.yaml") . | sha256sum }}
        checksum/license: {{ include "influxdb3-enterprise.licenseChecksum" . }}
        {{- if .Values.webui.enabled }}
        checksum/webui-secret: {{ include (print $.Template.BasePath "/secret-webui.yaml") . | sha256sum }}
        {{- $webuiConnection := .Values.webui.defaultConnection | default dict }}
        {{- if get $webuiConnection "enabled" }}
        checksum/webui-config: {{ include (print $.Template.BasePath "/secret-webui-config.yaml") . | sha256sum }}
        {{- end }}
        {{- end }}
        {{- with .Values.querier.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "influxdb3-enterprise.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: querier
        {{- with .Values.querier.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "influxdb3-enterprise.serviceAccountName" . }}
      {{- if not (kindIs "invalid" .Values.serviceAccount.automountServiceAccountToken) }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- if .Values.querier.priorityClassName }}
      priorityClassName: {{ .Values.querier.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.querier.podSecurityContext | nindent 8 }}
      containers:
        - name: influxdb3
          {{- with .Values.querier.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "influxdb3-enterprise.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --mode={{ include "influxdb3-enterprise.querierMode" . }}
            {{- include "influxdb3-enterprise.webuiArgs" . | nindent 12 }}
            - --node-id=$(POD_NAME)
          envFrom:
            - configMapRef:
                name: {{ include "influxdb3-enterprise.configMapName" . }}
          env:
            {{- include "influxdb3-enterprise.podNameEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.licenseEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.objectStoreSecretEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.adminTokenEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.permissionTokensEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.webuiEnv" . | nindent 12 }}
            {{- with .Values.querier.numIOThreads }}
            - name: INFLUXDB3_NUM_IO_THREADS
              value: {{ . | quote }}
            {{- end }}
            {{- if hasKey .Values.querier "numCores" }}
            - name: INFLUXDB3_NUM_CORES
              value: {{ .Values.querier.numCores | quote }}
            {{- end }}
            {{- $memory := .Values.querier.memory | default dict }}
            {{- if get $memory "execMemPoolSize" }}
            - name: INFLUXDB3_EXEC_MEM_POOL_SIZE
              value: {{ get $memory "execMemPoolSize" | quote }}
            {{- else if get $memory "execMemPoolBytes" }}
            - name: INFLUXDB3_EXEC_MEM_POOL_BYTES
              value: {{ get $memory "execMemPoolBytes" | quote }}
            {{- end }}
            {{- if get $memory "forceSnapshotMemSize" }}
            - name: INFLUXDB3_FORCE_SNAPSHOT_MEM_SIZE
              value: {{ get $memory "forceSnapshotMemSize" | quote }}
            {{- else if get $memory "forceSnapshotMemThreshold" }}
            - name: INFLUXDB3_FORCE_SNAPSHOT_MEM_THRESHOLD
              value: {{ get $memory "forceSnapshotMemThreshold" | quote }}
            {{- end }}
            {{- with .Values.querier.datafusion }}
            {{- if .numThreads }}
            - name: INFLUXDB3_NUM_DATAFUSION_THREADS
              value: {{ .numThreads | quote }}
            {{- end }}
            {{- if .maxParquetFanout }}
            - name: INFLUXDB3_DATAFUSION_MAX_PARQUET_FANOUT
              value: {{ .maxParquetFanout | quote }}
            {{- end }}
            {{- if .config }}
            - name: INFLUXDB3_DATAFUSION_CONFIG
              value: {{ .config | quote }}
            {{- end }}
            {{- end }}
            {{- include "influxdb3-enterprise.pachaTreeEnv" . | nindent 12 }}
            {{- include "influxdb3-enterprise.nonProcessorUnsetVars" (dict "root" . "component" .Values.querier) | nindent 12 }}
            {{- include "influxdb3-enterprise.componentExtraEnv" (dict "root" . "component" .Values.querier) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8181
              protocol: TCP
          {{- include "influxdb3-enterprise.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.querier.resources | nindent 12 }}
          volumeMounts:
            {{ include "influxdb3-enterprise.sharedVolumeMounts" . | nindent 12 }}
            {{ include "influxdb3-enterprise.adminTokenVolumeMounts" . | nindent 12 }}
            {{ include "influxdb3-enterprise.permissionTokensVolumeMounts" . | nindent 12 }}
            {{ include "influxdb3-enterprise.webuiVolumeMounts" . | nindent 12 }}
      {{- with .Values.querier.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.querier.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.querier.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{ include "influxdb3-enterprise.sharedVolumes" . | nindent 8 }}
        {{ include "influxdb3-enterprise.adminTokenVolumes" . | nindent 8 }}
        {{ include "influxdb3-enterprise.permissionTokensVolumes" . | nindent 8 }}
        {{ include "influxdb3-enterprise.webuiVolumes" . | nindent 8 }}
{{- end }}
