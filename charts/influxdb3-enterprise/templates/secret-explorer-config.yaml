{{- $explorer := .Values.explorer | default dict -}}
{{- $connection := get $explorer "defaultConnection" | default dict -}}
{{- if and (get $explorer "enabled") (get $connection "enabled") (not (get $connection "existingSecret" | default "")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "influxdb3-enterprise.explorerConfigSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: explorer
type: Opaque
data:
  {{- $config := dict
    "DEFAULT_INFLUX_SERVER" (include "influxdb3-enterprise.explorerDefaultConnectionServer" .)
    "DEFAULT_INFLUX_DATABASE" (get $connection "database" | default "")
    "DEFAULT_API_TOKEN" (get $connection "apiToken" | default "")
    "DEFAULT_SERVER_NAME" (include "influxdb3-enterprise.explorerDefaultConnectionServerName" .)
  }}
  config.json: {{ $config | toJson | b64enc | quote }}
{{- end }}
