{{- $explorer := .Values.explorer | default dict -}}
{{- if and (get $explorer "enabled") (not (get $explorer "existingSecret" | default "")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "influxdb3-enterprise.explorerSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: explorer
type: Opaque
data:
  session-secret: {{ get $explorer "sessionSecret" | b64enc | quote }}
{{- end }}
