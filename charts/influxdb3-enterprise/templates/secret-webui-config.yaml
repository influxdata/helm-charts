{{- $webui := .Values.webui | default dict -}}
{{- $connection := get $webui "defaultConnection" | default dict -}}
{{- if and (get $webui "enabled") (get $connection "enabled") (not (get $connection "existingSecret" | default "")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "influxdb3-enterprise.webuiConfigSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
type: Opaque
data:
  {{- $config := dict
    "DEFAULT_INFLUX_SERVER" (include "influxdb3-enterprise.webuiDefaultConnectionServer" .)
    "DEFAULT_INFLUX_DATABASE" (get $connection "database" | default "")
    "DEFAULT_API_TOKEN" (get $connection "apiToken" | default "")
    "DEFAULT_SERVER_NAME" (include "influxdb3-enterprise.webuiDefaultConnectionServerName" .)
  }}
  config.json: {{ $config | toJson | b64enc | quote }}
  DEFAULT_INFLUX_SERVER: {{ include "influxdb3-enterprise.webuiDefaultConnectionServer" . | b64enc | quote }}
  DEFAULT_INFLUX_DATABASE: {{ get $connection "database" | default "" | b64enc | quote }}
  DEFAULT_API_TOKEN: {{ get $connection "apiToken" | default "" | b64enc | quote }}
  DEFAULT_SERVER_NAME: {{ include "influxdb3-enterprise.webuiDefaultConnectionServerName" . | b64enc | quote }}
{{- end }}
