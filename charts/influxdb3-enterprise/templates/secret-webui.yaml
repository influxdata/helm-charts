{{- $webui := .Values.webui | default dict -}}
{{- if and (get $webui "enabled") (not (get $webui "existingSecret" | default "")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "influxdb3-enterprise.webuiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
type: Opaque
data:
  session-secret: {{ get $webui "sessionSecret" | b64enc | quote }}
{{- end }}
