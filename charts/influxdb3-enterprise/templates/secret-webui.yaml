{{- $webui := .Values.webui | default dict }}
{{- if and (get $webui "sessionSecret") (not (get $webui "existingSecret")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "influxdb3-enterprise.webuiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "influxdb3-enterprise.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ get $webui "sessionSecret" | quote }}
{{- end }}
