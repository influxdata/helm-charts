suite: numbers and legacy names in the server environment
release:
  name: t
  namespace: default
tests:
  # A number in a values file is a float64 and quote prints 1000000 as "1e+06",
  # which the server rejects at startup. Every value must reach it as written.
  - it: writes large numbers and numeric strings in full in the ConfigMap
    template: templates/configmap.yaml
    values: [values/large-numbers.yaml]
    asserts:
      - equal: {path: data.INFLUXDB3_CLUSTER_ID, value: "20240101"}
      - equal: {path: data.INFLUXDB3_ENTERPRISE_CLUSTER_ID, value: "20240101"}
      - equal: {path: data.INFLUXDB3_BUCKET, value: "12345678"}
      - equal: {path: data.INFLUXDB3_OBJECT_STORE_CONNECTION_LIMIT, value: "1000000"}
      - equal: {path: data.INFLUXDB3_OBJECT_STORE_MAX_RETRIES, value: "1000000"}
      - equal: {path: data.INFLUXDB3_MAX_HTTP_REQUEST_SIZE, value: "10485760"}
      - equal: {path: data.INFLUXDB3_PARQUET_MEM_CACHE_SIZE, value: "2147483648"}
      - equal: {path: data.INFLUXDB3_TABLE_INDEX_CACHE_MAX_ENTRIES, value: "1000000"}
      - equal: {path: data.INFLUXDB3_TABLE_INDEX_CACHE_CONCURRENCY_LIMIT, value: "1000000"}
      - equal: {path: data.INFLUXDB3_COMPACTED_DATA_LOAD_CONCURRENCY_LIMIT, value: "1000000"}
      - equal: {path: data.INFLUXDB3_ENTERPRISE_COMPACTED_DATA_LOAD_CONCURRENCY_LIMIT, value: "1000000"}
      - equal: {path: data.INFLUXDB3_TRACES_JAEGER_MAX_MSGS_PER_SECOND, value: "1000000"}

  - it: writes large numbers in full in the ingester environment
    template: templates/ingester-statefulset.yaml
    values: [values/large-numbers.yaml]
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_NUM_IO_THREADS, value: "1000000"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_EXEC_MEM_POOL_BYTES, value: "2147483648"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_NUM_DATAFUSION_THREADS, value: "1000000"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_WAL_FILES_PER_SNAPSHOT, value: "1000000"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_WAL_MAX_BUFFERED_WRITES, value: "1000000"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_SNAPSHOTTED_WAL_FILES_TO_KEEP, value: "1000000"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_MAX_TOTAL_COLUMNS, value: "10000000"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_GEN0_MAX_ROWS_PER_FILE, value: "10000000"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_AUTO_DVC_MAX_CARDINALITY, value: "1000000"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_WAL_REPLICA_QUEUE_LENGTH, value: "1000000"}}

  - it: writes large numbers in full in the querier environment
    template: templates/querier-statefulset.yaml
    values: [values/large-numbers.yaml]
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_EXEC_MEM_POOL_BYTES, value: "2147483648"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_DATAFUSION_MAX_PARQUET_FANOUT, value: "1000000"}}

  - it: writes large numbers in full in the compactor environment
    template: templates/compactor-statefulset.yaml
    values: [values/large-numbers.yaml]
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_COMPACTION_MAX_NUM_FILES_PER_PLAN, value: "1000000"}}

  - it: writes large numbers in full in the processor environment
    template: templates/processor-statefulset.yaml
    values: [values/large-numbers.yaml]
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ASYNC_TRIGGER_CONCURRENCY_LIMIT, value: "1000000"}}

  # ConfigMap data is a string map; a bare number is rejected by the API server.
  - it: renders resource limits as strings
    template: templates/configmap.yaml
    values: [values/resource-limits.yaml]
    asserts:
      - equal: {path: data.INFLUXDB3_NUM_DATABASE_LIMIT, value: "100"}
      - equal: {path: data.INFLUXDB3_ENTERPRISE_NUM_DATABASE_LIMIT, value: "100"}
      - equal: {path: data.INFLUXDB3_NUM_TABLE_LIMIT, value: "10000"}
      - equal: {path: data.INFLUXDB3_ENTERPRISE_NUM_TABLE_LIMIT, value: "10000"}
      - equal: {path: data.INFLUXDB3_NUM_TOTAL_COLUMNS_PER_TABLE_LIMIT, value: "500"}
      - equal: {path: data.INFLUXDB3_ENTERPRISE_NUM_TOTAL_COLUMNS_PER_TABLE_LIMIT, value: "500"}

  # 3.10 reads only the INFLUXDB3_ENTERPRISE_ licence names and the pre-3.11 WAL
  # and compaction names; 3.11 takes both and stays quiet when they agree.
  - it: sets the pre-3.11 licence names for a commercial licence
    template: templates/querier-statefulset.yaml
    values: [values/legacy-env.yaml]
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_LICENSE_FILE, value: /etc/influxdb/license}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ENTERPRISE_LICENSE_FILE, value: /etc/influxdb/license}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_LICENSE_TYPE, value: commercial}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ENTERPRISE_LICENSE_TYPE, value: commercial}}

  - it: sets the pre-3.11 licence names for a trial licence
    template: templates/querier-statefulset.yaml
    set:
      license.email: user@example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_ENTERPRISE_LICENSE_EMAIL
            valueFrom: {secretKeyRef: {name: t-influxdb3-enterprise-license, key: license-email}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ENTERPRISE_LICENSE_TYPE, value: trial}}

  - it: sets the pre-3.11 WAL names on the ingester
    template: templates/ingester-statefulset.yaml
    values: [values/legacy-env.yaml]
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_WAL_SNAPSHOT_SIZE, value: "600"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_WAL_MAX_WRITE_BUFFER_SIZE, value: "100000"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_NUM_WAL_FILES_TO_KEEP, value: "300"}}

  - it: sets the pre-3.11 compaction names on the compactor
    template: templates/compactor-statefulset.yaml
    values: [values/legacy-env.yaml]
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ENTERPRISE_COMPACTION_GEN2_DURATION, value: 20m}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ENTERPRISE_COMPACTION_MULTIPLIERS, value: "3,4,6,5"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ENTERPRISE_COMPACTION_MAX_NUM_FILES_PER_PLAN, value: "500"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ENTERPRISE_COMPACTION_CLEANUP_WAIT, value: 10m}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ENTERPRISE_COMPACTION_CHECK_INTERVAL, value: 10s}}

  - it: leaves the legacy names out when the setting is not used
    template: templates/ingester-statefulset.yaml
    asserts:
      - notContains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_WAL_SNAPSHOT_SIZE}, any: true}
      - notContains: {path: "spec.template.spec.containers[0].env", content: {name: INFLUXDB3_ENTERPRISE_LICENSE_FILE}, any: true}
