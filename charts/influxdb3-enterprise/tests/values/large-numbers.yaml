    execMemPoolBytes: 1048576
    forceSnapshotMemThreshold: 1048576
  datafusion:
    numThreads: 1000000
  wal:
    snapshotSize: 1000000
    maxWriteBufferSize: 1000000
    snapshotFilesToKeep: 1000000
querier:
  memory:
    execMemPoolBytes: 1048576
  datafusion:
    maxParquetFanout: 1000000
compactor:
  compaction:
    maxNumFilesPerPlan: 1000000
processingEngine:
  enabled: true
  asyncTriggerConcurrencyLimit: 1000000
