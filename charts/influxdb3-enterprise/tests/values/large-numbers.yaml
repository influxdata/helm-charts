objectStorage:
  type: s3
  bucket: test-bucket
  connectionLimit: 1000000
  maxRetries: 1000000
  http2MaxFrameSize: 1048576
http:
  maxRequestSize: 10485760
caching:
  parquetMemCacheSize: 1048576
  tableIndexCacheMaxEntries: 1000000
  tableIndexCacheConcurrencyLimit: 1000000
compactedData:
  loadConcurrencyLimit: 1000000
traces:
  exporter: jaeger
