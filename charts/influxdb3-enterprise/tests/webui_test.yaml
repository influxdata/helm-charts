suite: embedded Web UI
release:
  name: t
  namespace: default
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/webui-statefulset.yaml
      - hasDocuments:
          count: 0
        template: templates/webui-service.yaml

  - it: runs the server in webui mode when enabled
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --mode=webui
      - equal:
          path: spec.replicas
          value: 1

  - it: refuses to render without a session secret, which the server requires
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "webui.sessionSecret.existingSecret is required when webui.enabled is true: the server refuses to start in webui mode without a session secret, and every Web UI pod in the cluster has to share the same one."

  - it: takes the session secret from the named secret
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: ui-session
                key: session-secret

  - it: honours a custom key in that secret
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      webui.sessionSecret.key: signing-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: ui-session
                key: signing-key

  - it: leaves the cookie flag off for HTTP by default
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_COOKIE_SECURE
            value: "true"

  - it: honours an explicit secure cookie override without chart TLS
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      webui.cookieSecure: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_COOKIE_SECURE
            value: "true"

  - it: enables secure cookies automatically for Web UI ingress TLS
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      ingress.enabled: true
      ingress.webui.tls:
        - hosts:
            - explorer.influxdb.example.com
          secretName: ui-tls
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_COOKIE_SECURE
            value: "true"

  - it: honours an explicit false cookie override with Web UI ingress TLS
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      webui.cookieSecure: false
      ingress.enabled: true
      ingress.webui.tls:
        - hosts:
            - explorer.influxdb.example.com
          secretName: ui-tls
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_COOKIE_SECURE
            value: "true"

  - it: claims licensed cores like any other node
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      webui.numCores: 2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_NUM_CORES
            value: "2"

  - it: serves the UI on the http port
    template: templates/webui-service.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8181
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: webui

  - it: keeps webui out of the other components, which is where it would be silently ignored
    template: templates/configmap.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - notExists:
          path: data.INFLUXDB3_WEBUI_SESSION_SECRET

  - it: runs as the influxdb3 user like every other component
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1500
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: gets a NetworkPolicy of its own, so it is not the one unrestricted pod
    template: templates/networkpolicy.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      networkPolicy.enabled: true
    documentSelector:
      path: metadata.name
      value: t-influxdb3-enterprise-webui
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: webui

  - it: gets a PDB, which the README promises for every component
    template: templates/pdb.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      webui.podDisruptionBudget.enabled: true
      webui.replicas: 2
    documentSelector:
      path: metadata.name
      value: t-influxdb3-enterprise-webui
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1

  - it: is scraped by Prometheus like every other component
    template: templates/servicemonitor.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      serviceMonitor.enabled: true
    documentSelector:
      path: metadata.name
      value: t-influxdb3-enterprise-webui
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: webui

  - it: refuses an empty session secret key instead of quietly defaulting
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      webui.sessionSecret.key: ""
    asserts:
      - failedTemplate:
          errorMessage: "webui.sessionSecret.key is empty; set the key that holds the session secret in webui.sessionSecret.existingSecret."

  - it: emits no ServiceMonitor while serviceMonitor is off
    template: templates/servicemonitor.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps an explicit zero maxUnavailable, which forbids voluntary disruption
    template: templates/pdb.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      webui.podDisruptionBudget.enabled: true
      webui.replicas: 2
      webui.podDisruptionBudget.maxUnavailable: 0
    documentSelector:
      path: metadata.name
      value: t-influxdb3-enterprise-webui
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 0

  # A node left unset claims every core the machine reports, which on a core-limited
  # licence leaves another component short and never Ready.
  - it: claims two licensed cores by default
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_NUM_CORES
            value: "2"

  # The UI ships <base href="/">, so it cannot live under a path on the shared
  # host, and ingress.query already claims / there.
  - it: gets an ingress on a host of its own, derived from ingress.host
    template: templates/ingress-webui.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - equal:
          path: spec.rules[0].host
          value: explorer.influxdb.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: t-influxdb3-enterprise-webui
      - notExists:
          path: metadata.annotations

  - it: follows a changed ingress.host
    template: templates/ingress-webui.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      ingress.host: influxdb.acme.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: explorer.influxdb.acme.com

  - it: takes an explicit host override
    template: templates/ingress-webui.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      ingress.host: ""
      ingress.webui.host: ui.acme.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: ui.acme.com

  - it: rejects a shared host when both WebUI and query ingresses are enabled
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      ingress.host: ui.acme.com
      ingress.webui.host: ui.acme.com
    asserts:
      - failedTemplate:
          errorMessage: "ingress.webui.host must differ from ingress.host when the WebUI and querier ingresses are enabled; both claim /."

  - it: permits a shared host and TLS when the querier is disabled
    template: templates/ingress-webui.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      querier.enabled: false
      ingress.host: ui.acme.com
      ingress.webui.host: ui.acme.com
      ingress.tls:
        - hosts: [ui.acme.com]
          secretName: shared-tls
    asserts:
      - equal:
          path: spec.rules[0].host
          value: ui.acme.com
      - equal:
          path: spec.tls[0].secretName
          value: shared-tls

  - it: renders no ingress while the Web UI is off
    template: templates/ingress-webui.yaml
    set:
      ingress.host: ui.acme.com
      ingress.webui.host: ui.acme.com
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no ingress when ingress is disabled entirely
    template: templates/ingress-webui.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      ingress.enabled: false
      ingress.host: ui.acme.com
      ingress.webui.host: ui.acme.com
    asserts:
      - hasDocuments:
          count: 0

  - it: advertises the ingester for Explorer routing without processors
    template: templates/ingester-statefulset.yaml
    values:
      - values/webui-auth.yaml
    set:
      processingEngine.enabled: false
      ingester.internode.port: 9193
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --internode-bind-addr=0.0.0.0:9193
      - contains:
          path: spec.template.spec.containers[0].args
          content: --conn-info=$(POD_NAME):9193
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc-internode
            containerPort: 9193
            protocol: TCP

  - it: routes each ingester advertised hostname to its own pod
    template: templates/ingester-service.yaml
    values:
      - values/webui-auth.yaml
    set:
      processingEngine.enabled: false
      ingester.replicas: 2
      ingester.internode.port: 9193
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: t-influxdb3-enterprise-ingester-0
        documentIndex: 1
      - equal:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]
          value: t-influxdb3-enterprise-ingester-0
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 9193
        documentIndex: 1
      - equal:
          path: metadata.name
          value: t-influxdb3-enterprise-ingester-1
        documentIndex: 2
      - equal:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]
          value: t-influxdb3-enterprise-ingester-1
        documentIndex: 2
      - equal:
          path: spec.ports[0].port
          value: 9193
        documentIndex: 2

  - it: permits Explorer ingress to the ingester HTTP and internode endpoints
    template: templates/networkpolicy.yaml
    values:
      - values/webui-auth.yaml
    set:
      networkPolicy.enabled: true
      processingEngine.enabled: false
      ingester.internode.port: 9193
    documentSelector:
      path: metadata.name
      value: t-influxdb3-enterprise-ingester
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: influxdb3-enterprise
                    app.kubernetes.io/instance: t
                    app.kubernetes.io/component: webui
            ports:
              - protocol: TCP
                port: 8181
              - protocol: TCP
                port: 9193

  - it: advertises the querier for Explorer routing without processors
    template: templates/querier-statefulset.yaml
    values:
      - values/webui-auth.yaml
    set:
      processingEngine.enabled: false
      querier.internode.port: 9194
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --internode-bind-addr=0.0.0.0:9194
      - contains:
          path: spec.template.spec.containers[0].args
          content: --conn-info=$(POD_NAME):9194
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc-internode
            containerPort: 9194
            protocol: TCP

  - it: routes each querier advertised hostname to its own pod
    template: templates/querier-service.yaml
    values:
      - values/webui-auth.yaml
    set:
      processingEngine.enabled: false
      querier.replicas: 2
      querier.internode.port: 9194
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: t-influxdb3-enterprise-querier-0
        documentIndex: 1
      - equal:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]
          value: t-influxdb3-enterprise-querier-0
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 9194
        documentIndex: 1
      - equal:
          path: metadata.name
          value: t-influxdb3-enterprise-querier-1
        documentIndex: 2
      - equal:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]
          value: t-influxdb3-enterprise-querier-1
        documentIndex: 2
      - equal:
          path: spec.ports[0].port
          value: 9194
        documentIndex: 2

  - it: permits Explorer ingress to the querier HTTP and internode endpoints
    template: templates/networkpolicy.yaml
    values:
      - values/webui-auth.yaml
    set:
      networkPolicy.enabled: true
      processingEngine.enabled: false
      querier.internode.port: 9194
    documentSelector:
      path: metadata.name
      value: t-influxdb3-enterprise-querier
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: influxdb3-enterprise
                    app.kubernetes.io/instance: t
                    app.kubernetes.io/component: webui
            ports:
              - protocol: TCP
                port: 8181
              - protocol: TCP
                port: 9194

  - it: opens no Explorer internode endpoints while both WebUI and processors are disabled
    set:
      webui.enabled: false
      processingEngine.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --internode-bind-addr=0.0.0.0:8183
        template: templates/ingester-statefulset.yaml
      - hasDocuments:
          count: 1
        template: templates/ingester-service.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --internode-bind-addr=0.0.0.0:8183
        template: templates/querier-statefulset.yaml
      - hasDocuments:
          count: 1
        template: templates/querier-service.yaml

  - it: supplies the user authentication signing secret to every component
    values:
      - values/webui-auth.yaml
    set:
      processingEngine.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_USER_AUTH_TYPE
            value: basic
        template: templates/webui-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_KEY_ID
            value: webui-signing-1
        template: templates/webui-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/webui-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_USER_AUTH_TYPE
            value: basic
        template: templates/ingester-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_KEY_ID
            value: webui-signing-1
        template: templates/ingester-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/ingester-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_USER_AUTH_TYPE
            value: basic
        template: templates/querier-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_KEY_ID
            value: webui-signing-1
        template: templates/querier-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/querier-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_USER_AUTH_TYPE
            value: basic
        template: templates/compactor-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_KEY_ID
            value: webui-signing-1
        template: templates/compactor-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/compactor-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_USER_AUTH_TYPE
            value: basic
        template: templates/processor-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_KEY_ID
            value: webui-signing-1
        template: templates/processor-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/processor-statefulset.yaml

  - it: permits Explorer egress to both internode ports when they differ
    template: templates/networkpolicy.yaml
    values:
      - values/webui-auth.yaml
    set:
      networkPolicy.enabled: true
      processingEngine.enabled: false
      ingester.internode.port: 9193
      querier.internode.port: 9194
    documentSelector:
      path: metadata.name
      value: t-influxdb3-enterprise-webui
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: influxdb3-enterprise
                    app.kubernetes.io/instance: t
                    app.kubernetes.io/component: ingester
            ports:
              - protocol: TCP
                port: 9193
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: influxdb3-enterprise
                    app.kubernetes.io/instance: t
                    app.kubernetes.io/component: querier
            ports:
              - protocol: TCP
                port: 9194


  - it: applies the JWT signing Secret to every node
    values: [values/webui-auth.yaml]
    set:
      processingEngine.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/ingester-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/querier-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/compactor-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/processor-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: influxdb3-user-auth
                key: private-key.pem
        template: templates/webui-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_USER_AUTH_TYPE
            value: basic
        template: templates/webui-statefulset.yaml

  - it: keeps explicit extraEnv authentication overrides without duplicates
    template: templates/webui-statefulset.yaml
    values: [values/webui-auth.yaml]
    set:
      extraEnv:
        - name: INFLUXDB3_JWT_KEY_ID
          value: explicit-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_KEY_ID
            value: explicit-key
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_KEY_ID
            value: webui-signing-1

  - it: preserves the legacy extraEnv authentication configuration
    template: templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      extraEnv:
        - name: INFLUXDB3_USER_AUTH_TYPE
          value: basic
        - name: INFLUXDB3_JWT_KEY_ID
          value: legacy-key
        - name: INFLUXDB3_JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: legacy-user-auth
              key: private-key.pem
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_USER_AUTH_TYPE
            value: basic
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: legacy-user-auth
                key: private-key.pem

  - it: derives the OAuth public URI from the HTTP ingress
    template: templates/webui-statefulset.yaml
    values: [values/webui-oauth.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_PUBLIC_URI
            value: http://explorer.influxdb.example.com

  - it: derives the OAuth public URI from the Web UI ingress TLS
    template: templates/webui-statefulset.yaml
    values: [values/webui-oauth.yaml]
    set:
      ingress.webui.host: ui.example.com
      ingress.webui.tls:
        - hosts: [ui.example.com]
          secretName: ui-tls
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_PUBLIC_URI
            value: https://ui.example.com

  - it: accepts an external HTTPS public URI and enables secure cookies
    template: templates/webui-statefulset.yaml
    values: [values/webui-oauth.yaml]
    set:
      ingress.enabled: false
      webui.publicUri: https://external.example.com/
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_PUBLIC_URI
            value: https://external.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_COOKIE_SECURE
            value: "true"

  - it: preserves an explicit false secure-cookie override with an HTTPS public URI
    template: templates/webui-statefulset.yaml
    values: [values/webui-oauth.yaml]
    set:
      ingress.enabled: false
      webui.publicUri: https://external.example.com
      webui.cookieSecure: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_COOKIE_SECURE
            value: "true"

  - it: preserves an explicit true RBAC authoring environment value on every node
    templates:
      - templates/ingester-statefulset.yaml
      - templates/querier-statefulset.yaml
      - templates/compactor-statefulset.yaml
      - templates/processor-statefulset.yaml
      - templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      processingEngine.enabled: true
      security.userAuth.rbacAuthoringDisabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --rbac-authoring-disabled=true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --rbac-authoring-disabled=false

  - it: preserves an explicit false RBAC authoring environment value on every node
    templates:
      - templates/ingester-statefulset.yaml
      - templates/querier-statefulset.yaml
      - templates/compactor-statefulset.yaml
      - templates/processor-statefulset.yaml
      - templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      processingEngine.enabled: true
      security.userAuth.rbacAuthoringDisabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --rbac-authoring-disabled=true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --rbac-authoring-disabled=false

  - it: leaves the RBAC authoring server default when the value is omitted
    templates:
      - templates/ingester-statefulset.yaml
      - templates/querier-statefulset.yaml
      - templates/compactor-statefulset.yaml
      - templates/processor-statefulset.yaml
      - templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      processingEngine.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "false"

  - it: leaves the RBAC authoring server default when the value is null
    templates:
      - templates/ingester-statefulset.yaml
      - templates/querier-statefulset.yaml
      - templates/compactor-statefulset.yaml
      - templates/processor-statefulset.yaml
      - templates/webui-statefulset.yaml
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      processingEngine.enabled: true
      security.userAuth.rbacAuthoringDisabled: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "false"

  - it: preserves extraEnv precedence for the RBAC authoring environment value
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      security.userAuth.rbacAuthoringDisabled: false
      extraEnv:
        - name: INFLUXDB3_RBAC_AUTHORING_DISABLED
          value: "true"
      webui.extraEnv:
        - name: INFLUXDB3_RBAC_AUTHORING_DISABLED
          value: "false"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "true"
        template: templates/ingester-statefulset.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "false"
        template: templates/ingester-statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "false"
        template: templates/webui-statefulset.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_RBAC_AUTHORING_DISABLED
            value: "true"
        template: templates/webui-statefulset.yaml

  - it: rejects a non-boolean RBAC authoring value
    set:
      security.userAuth.rbacAuthoringDisabled: "false"
    asserts:
      - failedTemplate:
          errorMessage: "security.userAuth.rbacAuthoringDisabled must be a boolean."

  - it: rejects unsupported authentication methods
    set:
      security.userAuth.type: invalid
    asserts:
      - failedTemplate:
          errorMessage: "security.userAuth.type must be none, basic, oauth, basic,oauth, or oauth,basic."

  - it: rejects basic sign-in without a JWT key ID
    set:
      security.userAuth.type: basic
    asserts:
      - failedTemplate:
          errorMessage: "security.userAuth.jwt.keyId is required for JWT signing."

  - it: rejects basic sign-in without a JWT Secret
    set:
      security.userAuth.type: basic
      security.userAuth.jwt.keyId: key-1
    asserts:
      - failedTemplate:
          errorMessage: "security.userAuth.jwt.existingSecret is required for JWT signing."

  - it: rejects OAuth without an issuer
    set:
      security.userAuth.type: oauth
    asserts:
      - failedTemplate:
          errorMessage: "security.userAuth.oauth.issuer is required for OAuth."

  - it: rejects a missing public URI without an ingress
    values: [values/webui-oauth.yaml]
    set:
      ingress.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "webui.publicUri is required for Explorer OAuth sign-in when ingress.enabled is false."

  - it: rejects user sign-in while all authentication is disabled
    set:
      security.auth.disabled: true
      security.userAuth.type: basic
    asserts:
      - failedTemplate:
          errorMessage: "security.auth.disabled must be false when security.userAuth.type enables sign-in."

  - it: rejects an empty derived Web UI ingress hostname
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      ingress.host: ""
      querier.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "ingress.webui.host is required when ingress.host is empty and the Web UI ingress is enabled."

  - it: includes the Web UI URL, token-only setup, and additional requests in notes
    template: templates/NOTES.txt
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
    asserts:
      - matchRegexRaw:
          pattern: 'Web UI: 1 replica'
      - matchRegexRaw:
          pattern: 'URL: http://explorer\.influxdb\.example\.com\n'
      - matchRegexRaw:
          pattern: "Token-only setup: enter the API ingress endpoint listed above and an API token as the connection\\. Use the ingress controller's actual external port\\."
      - matchRegexRaw:
          pattern: 'The endpoint must resolve and be reachable from the Web UI pod; with NetworkPolicies enabled, allow egress to its address and port\.'
      - matchRegexRaw:
          pattern: 'Web UI \(additional\): 1 x CPU 250m, memory 512Mi per pod'
      - matchRegexRaw:
          pattern: 'Web UI ingress has no TLS configuration'
      - notMatchRegexRaw:
          pattern: 'WARNING: Authentication is disabled'

  - it: includes a port-forward and routing guidance when ingress is disabled
    template: templates/NOTES.txt
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      ingress.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: 'kubectl port-forward -n default svc/t-influxdb3-enterprise-webui 8181:8181'
      - matchRegexRaw:
          pattern: 'Token-only setup needs one API endpoint routing reads to queriers and writes to ingesters'

  - it: links first-admin setup when user sign-in is enabled
    template: templates/NOTES.txt
    values: [values/webui-auth.yaml]
    asserts:
      - matchRegexRaw:
          pattern: 'manage-users/#bootstrap-the-initial-admin'
      - notMatchRegexRaw:
          pattern: 'Token-only setup'

  - it: warns when authentication is explicitly disabled
    template: templates/NOTES.txt
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      security.auth.disabled: true
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: Authentication is disabled. Protect remote Explorer access'
      - notMatchRegexRaw:
          pattern: 'Token-only setup'

  - it: uses the Web UI TLS configuration in the notes URL
    template: templates/NOTES.txt
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      ingress.port: 443
      ingress.webui.tls:
        - hosts: [explorer.influxdb.example.com]
          secretName: ui-tls
    asserts:
      - matchRegexRaw:
          pattern: 'URL: https://explorer\.influxdb\.example\.com\n'
      - notMatchRegexRaw:
          pattern: 'Web UI ingress has no TLS configuration'

  - it: tolerates missing Web UI resources and service settings in notes
    template: templates/NOTES.txt
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      webui.resources: null
      webui.service: null
      ingress.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: 'CPU unspecified, memory unspecified per pod'
      - matchRegexRaw:
          pattern: 'svc/t-influxdb3-enterprise-webui 8181:8181'

  - it: tolerates missing Web UI resource requests in notes
    template: templates/NOTES.txt
    set:
      webui.enabled: true
      webui.sessionSecret.existingSecret: ui-session
      webui.resources.requests: null
    asserts:
      - matchRegexRaw:
          pattern: 'CPU unspecified, memory unspecified per pod'

  - it: ignores ingress.port when deriving the public URI in notes and OAuth configuration
    values: [values/webui-oauth.yaml]
    set:
      ingress.port: 8080
    asserts:
      - matchRegexRaw:
          pattern: 'URL: http://explorer\.influxdb\.example\.com\n'
        template: templates/NOTES.txt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_PUBLIC_URI
            value: http://explorer.influxdb.example.com
        template: templates/webui-statefulset.yaml

  - it: uses an explicit public URI in both notes and OAuth configuration
    values: [values/webui-oauth.yaml]
    set:
      webui.publicUri: https://external.example.com:9443/
    asserts:
      - matchRegexRaw:
          pattern: 'URL: https://external.example.com:9443'
        template: templates/NOTES.txt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFLUXDB3_WEBUI_PUBLIC_URI
            value: https://external.example.com:9443
        template: templates/webui-statefulset.yaml
